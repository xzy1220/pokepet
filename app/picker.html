<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选择宝可梦</title>
<style>
  :root {
    --bg: #12141a; --panel: #191c24; --line: #262a35;
    --txt: #e8ebf2; --dim: #8b93a5; --accent: #ffcb05;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font: 14px/1.5 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif; }

  header {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center;
    padding: 14px 18px; background: rgba(18,20,26,.94); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  #q {
    flex: 1; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--txt); font-size: 14px; outline: none;
  }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,203,5,.12); }
  /* 胶囊开关：隐藏原生 checkbox，用 :has 上状态，视觉和卡片同一套语言 */
  .pill {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 14px 0 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    font-size: 13px; white-space: nowrap; cursor: pointer; user-select: none;
    transition: border-color .13s ease, background .13s ease, color .13s ease, box-shadow .13s ease;
  }
  .pill::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: #4d5464; transition: background .13s ease, box-shadow .13s ease;
  }
  .pill:hover { border-color: #3a4152; color: #b9c0cf; }
  .pill:has(input:checked) {
    background: rgba(255, 203, 5, .10);
    border-color: rgba(255, 203, 5, .55);
    color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255, 203, 5, .10);
  }
  .pill:has(input:checked)::before { background: var(--accent); box-shadow: 0 0 7px rgba(255, 203, 5, .75); }
  .pill:has(input:focus-visible) { box-shadow: 0 0 0 3px rgba(255, 203, 5, .22); }
  .pill input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #count { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

  #grid {
    display: grid; gap: 10px; padding: 14px 18px 40px;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  }

  .card {
    position: relative; padding: 8px 6px 9px; border-radius: 12px; cursor: pointer;
    background: var(--panel); border: 1px solid transparent; text-align: center;
    transition: transform .08s ease, border-color .12s ease, background .12s ease;
  }
  .card:hover { border-color: #3a4152; background: #1e222c; }
  .card:active { transform: scale(.975); }
  .card.current { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,203,5,.18); }
  .card.none { opacity: .46; }

  .thumb { height: 64px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 4px; }
  .thumb img { max-width: 100%; max-height: 64px; object-fit: contain; }
  .thumb.ph {
    border-radius: 8px; height: 64px; align-items: center; color: #fff;
    font-weight: 800; font-size: 17px; letter-spacing: .5px; opacity: .82;
  }

  .no { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .nm { font-size: 13px; font-weight: 600; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 10px; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 收藏星标：平时半透明，鼠标移到卡片上才亮；已收藏的一直亮 */
  .star {
    position: absolute; top: 3px; right: 3px; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 7px; font-size: 15px; line-height: 1; color: #4d5464;
    opacity: 0; transition: opacity .12s ease, background .12s ease, color .12s ease;
  }
  .card:hover .star { opacity: 1; }
  .star:hover { background: rgba(255,255,255,.09); color: #b9c0cf; }
  .star.on { opacity: 1; color: var(--accent); }
  .card.fav { border-color: rgba(255,203,5,.42); }
  .card.fav:hover { border-color: rgba(255,203,5,.62); }

  /* 收藏筛选打开时，顶部空目录提示 */
  #favHint { padding: 8px 18px 0; color: var(--dim); font-size: 12px; }

  #empty { padding: 60px; text-align: center; color: var(--dim); }
</style>
</head>
<body>
  <header>
    <input id="q" placeholder="搜索：名字 / 编号 / 英文 / 属性 / 拼音，例如 皮卡丘、025、pikachu、电、pkq" autofocus>
    <label class="pill"><input type="checkbox" id="onlyFav">只看收藏</label>
    <label class="pill"><input type="checkbox" id="onlyHave">只看有图</label>
    <span id="count"></span>
  </header>
  <div id="favHint" hidden>还没有收藏。点卡片右上角的 ☆ 就能收藏，之后打开「只看收藏」直接筛出来。</div>
  <div id="grid"></div>
  <div id="empty" hidden>没找到匹配的宝可梦</div>
  <script src="picker.js"></script>
</body>
</html>
