<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>支持一下</title>
<style>
  :root {
    --bg: #12141a;
    --card: #191c24;
    --line: #262b36;
    --text: #e8eaf0;
    --muted: #8b93a5;
    --gold: #ffcb05;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.75 "Microsoft YaHei", "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 26px 28px 18px;
    user-select: none;
  }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h1 .heart { color: #ff6b81; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }

  .copy {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .copy p { margin: 0; }
  .copy p + p { margin-top: 6px; }
  .dim { color: var(--muted); }

  .codes {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 6px;
  }
  .code {
    flex: 1;
    max-width: 190px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .code h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); font-weight: 500; }
  .code img {
    width: 100%;
    max-width: 148px;
    height: auto;
    border-radius: 6px;
    background: #fff;
    display: block;
    margin: 0 auto;
  }
  .code .empty {
    width: 100%;
    max-width: 148px;
    height: 148px;
    margin: 0 auto;
    border: 1px dashed var(--line);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5b6375;
    font-size: 12px;
  }

  .linkRow { text-align: center; margin: 14px 0 4px; }
  .linkRow button {
    font: inherit;
    color: #12141a;
    background: var(--gold);
    border: 0;
    border-radius: 9px;
    padding: 9px 22px;
    font-weight: 600;
    cursor: pointer;
  }
  .linkRow button:hover { filter: brightness(1.06); }

  .note { color: var(--muted); font-size: 11.5px; text-align: center; margin-top: 10px; }

  footer {
    margin-top: auto;
    padding-top: 10px;
    display: flex;
    justify-content: flex-end;
    border-top: 1px solid var(--line);
  }
  footer button {
    font: inherit;
    color: var(--text);
    background: #232833;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 16px;
    cursor: pointer;
  }
  footer button:hover { border-color: #3a4152; background: #272c38; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>支持一下 <span class="heart">♥</span></h1>
  <div class="sub">本软件完全免费，无广告、无内购</div>

  <div class="copy">
    <p>如果这个项目对你有帮助，欢迎自愿支持投喂。</p>
    <p class="dim">所有支持都是自愿的，不会解锁任何功能，也不影响使用体验。</p>
  </div>

  <div class="codes" id="codes">
    <div class="code" id="boxWx">
      <h2>微信</h2>
      <div class="empty">作者还没放码</div>
    </div>
    <div class="code" id="boxAli">
      <h2>支付宝</h2>
      <div class="empty">作者还没放码</div>
    </div>
  </div>

  <div class="linkRow hidden" id="linkRow">
    <button id="btnLink">打开赞助页面</button>
  </div>

  <div class="note" id="note">二维码由作者自行配置，本程序不联网、不上传任何信息。</div>

  <footer>
    <button id="btnClose">关闭</button>
  </footer>

<script>
  const $ = (id) => document.getElementById(id);

  function put(boxId, url) {
    const box = document.getElementById(boxId);
    if (!url) { box.classList.add('hidden'); return; }   // 没配的那一张就不显示，免得占位
    box.classList.remove('hidden');
    box.innerHTML = '';
    const h = document.createElement('h2');
    h.textContent = boxId === 'boxWx' ? '微信' : '支付宝';
    box.appendChild(h);
    const img = document.createElement('img');
    img.src = url;
    img.alt = '赞赏码';
    box.appendChild(img);
  }

  (async () => {
    const d = await window.info.get();
    put('boxWx', d.qrWechat);
    put('boxAli', d.qrAlipay);

    if (!d.qrWechat && !d.qrAlipay) {
      $('codes').classList.add('hidden');
      $('note').textContent = '赞赏码还没配置。把微信/支付宝收款码存成 assets\\support\\wechat.png 与 alipay.png 即可显示。';
    } else if (d.qrWechat && d.qrAlipay) {
      $('note').textContent = '支持纯属自愿，不影响任何功能。本程序不联网、不上传任何信息。';
    } else {
      $('note').textContent = '支持纯属自愿，不影响任何功能。本程序不联网、不上传任何信息。';
    }

    if (d.supportUrl) {
      $('linkRow').classList.remove('hidden');
      $('btnLink').addEventListener('click', () => window.info.openUrl(d.supportUrl));
    }

    $('btnClose').addEventListener('click', () => window.info.close());
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.info.close(); });
  })();
</script>
</body>
</html>
